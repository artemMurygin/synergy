services:
  app:
    build: { context: ., dockerfile: Dockerfile.dev }
    ports: ["${APP_PORT:-3000}:3000"]
    env_file: .env
    environment: # внутри сети compose хосты сервисов другие
      PORT: "3000"
      POSTGRES_URL: postgresql://audit:audit@postgres:5432/audit_agent
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      LOKI_URL: http://loki:3100
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    develop:
      watch:
        - { action: sync, path: ./src, target: /app/src }
        - { action: sync, path: ./prisma, target: /app/prisma }
        - { action: sync+restart, path: ./nest-cli.json, target: /app/nest-cli.json }
        - { action: rebuild, path: ./package.json }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit_agent
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_agent"]
      interval: 3s
      retries: 20

  # Внешняя БД пока недоступна: запускается только с `--profile mssql`
  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Audit_Agent1
    ports: ["1433:1433"]
    volumes: [mssqldata:/var/opt/mssql]

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT_PUBLISHED:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:latest
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki]

volumes:
  pgdata:
  mssqldata:
  redisdata:
  grafanadata:
